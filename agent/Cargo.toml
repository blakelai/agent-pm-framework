[package]
name = "pm-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Local project management agent for Obsidian-compatible workspaces"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
jsonschema = { version = "0.33", default-features = false }
lopdf = { version = "0.45", default-features = false }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "3.5", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
roxmltree = "0.21.1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
axum = "0.8"

[[bin]]
name = "pm-agent"
path = "src/main.rs"
