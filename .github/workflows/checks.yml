name: Framework checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install legacy comparison test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Test framework behavior and clean distribution
        run: python -m unittest discover -s tests -v

  rust-agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Install legacy comparison test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Check formatting
        run: cargo fmt --manifest-path agent/Cargo.toml --check
      - name: Check Rust diagnostics
        run: cargo clippy --manifest-path agent/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test runtime and local provider and MCP fixtures
        run: cargo test --manifest-path agent/Cargo.toml --locked
