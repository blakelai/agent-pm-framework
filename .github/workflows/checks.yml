name: Framework checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation and PDF test dependencies
        run: python -m pip install -r requirements.txt -r requirements-pdf.txt 'reportlab>=4,<5'
      - name: Test framework behavior and clean distribution
        run: python -m unittest discover -s tests -v
